<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HogentX · 新加坡 / 马来西亚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* === THEME: revenue ledger — paper, ink, one red for leaks, one green for recovered === */
:root {
  --stage-bg: #d9d3c7;
  --slide-bg: #F3EFE6;
  --paper: #F3EFE6;
  --ink: #16181D;
  --ink-soft: #5b5e66;
  --rule: rgba(22, 24, 29, 0.14);
  --leak: #C8452B;
  --ok: #0E7C5A;
  --wip: #B7791F;
  --brand: #2d60ff;
  --font-serif: 'Noto Serif SC', serif;
  --font-body: 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'Noto Sans SC', monospace;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

/* === FIXED STAGE (viewport-base.css) === */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: var(--slide-bg, #fff); }
.slide { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; display: block; visibility: hidden; opacity: 0; pointer-events: none; background: var(--slide-bg, #fff); }
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; } }

/* === TITLE SLIDE: left thesis, right ledger === */
.slide { color: var(--ink); font-family: var(--font-body); }
.margin { position: absolute; left: 96px; top: 0; bottom: 0; width: 2px; background: var(--leak); opacity: 0.55; }
.left { position: absolute; left: 150px; top: 84px; width: 860px; }
.brandmark { display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-weight: 600; font-size: 28px; }
.brandmark img { width: 40px; height: 40px; }
.kicker { margin-top: 120px; font-family: var(--font-mono); font-size: 24px; color: var(--ink-soft); letter-spacing: 0.06em; }
h1 { margin-top: 26px; font-family: var(--font-serif); font-weight: 900; font-size: 90px; line-height: 1.3; }
h1 .u { background: linear-gradient(transparent 72%, rgba(14,124,90,0.22) 72%); }
.sub { margin-top: 40px; font-size: 30px; line-height: 1.6; color: var(--ink-soft); width: 800px; }
.foot { position: absolute; left: 150px; bottom: 72px; font-family: var(--font-mono); font-size: 22px; color: var(--ink-soft); }
.right { position: absolute; left: 1080px; top: 120px; width: 720px; }
.right h2 { font-family: var(--font-mono); font-size: 22px; font-weight: 600; letter-spacing: 0.14em; color: var(--ink-soft); padding-bottom: 18px; border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; }
.row { display: grid; grid-template-columns: 64px 1fr 150px; align-items: center; height: 104px; border-bottom: 1px solid var(--rule); }
.row .no { font-family: var(--font-mono); font-size: 22px; color: var(--ink-soft); }
.row .t { font-size: 30px; font-weight: 500; }
.row .t s { text-decoration: none; color: var(--leak); font-family: var(--font-mono); margin-right: 10px; }
.stamp { justify-self: end; font-size: 22px; font-weight: 700; padding: 6px 14px; border: 2px solid currentColor; border-radius: 4px; transform: rotate(-3deg); }
.stamp.ok { color: var(--ok); } .stamp.wip { color: var(--wip); }
.total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 22px; border-top: 2px solid var(--ink); margin-top: -1px; font-family: var(--font-mono); font-size: 22px; color: var(--ink-soft); }
.total b { font-family: var(--font-serif); font-size: 56px; color: var(--ok); }

/* === ANIMATION: ledger rows write in one by one === */
.reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.7s var(--ease-out-expo), transform 0.7s var(--ease-out-expo); }
.slide.visible .reveal { opacity: 1; transform: none; }
.row { opacity: 0; transform: translateX(24px); transition: opacity 0.5s var(--ease-out-expo), transform 0.5s var(--ease-out-expo); }
.slide.visible .row { opacity: 1; transform: none; }
.row:nth-of-type(1) { transition-delay: 0.4s; } .row:nth-of-type(2) { transition-delay: 0.5s; } .row:nth-of-type(3) { transition-delay: 0.6s; }
.row:nth-of-type(4) { transition-delay: 0.7s; } .row:nth-of-type(5) { transition-delay: 0.8s; } .row:nth-of-type(6) { transition-delay: 0.9s; }
.d1 { transition-delay: 0.05s; } .d2 { transition-delay: 0.15s; } .d3 { transition-delay: 0.3s; } .d4 { transition-delay: 1.05s; }
</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">
    <section class="slide active visible">
      <div class="margin"></div>
      <div class="left">
        <div class="brandmark reveal d1"><img src="assets/favicon.svg" alt="">HogentX</div>
        <p class="kicker reveal d2">酒店 AI 数字员工 · 新加坡 / 马来西亚 · 2026</p>
        <h1 class="reveal d2">让每一间房，<br>卖出它<span class="u">该有的价钱</span>。</h1>
        <p class="sub reveal d3">已在自有品牌「住小叮」29 家门店日常运行。我们把酒店收入悄悄流失的地方逐项找出来，再交给店长确认处理。</p>
      </div>
      <p class="foot reveal d3">hogentx.com</p>
      <div class="right">
        <h2 class="reveal d1"><span>收入流失账目</span><span>状态</span></h2>
        <div class="rows">
          <div class="row"><span class="no">01</span><span class="t"><s>−</s>未来空房发现太晚</span><span class="stamp ok">已上线</span></div>
          <div class="row"><span class="no">02</span><span class="t"><s>−</s>价格偏高丢单、偏低少收</span><span class="stamp ok">已上线</span></div>
          <div class="row"><span class="no">03</span><span class="t"><s>−</s>有房漏卖、没房接单</span><span class="stamp ok">已上线</span></div>
          <div class="row"><span class="no">04</span><span class="t"><s>−</s>改价慢、平台漏改</span><span class="stamp ok">已上线</span></div>
          <div class="row"><span class="no">05</span><span class="t"><s>−</s>差评拖累下单与房价</span><span class="stamp ok">已上线</span></div>
          <div class="row"><span class="no">06</span><span class="t"><s>−</s>订房平台佣金</span><span class="stamp wip">开发中</span></div>
        </div>
        <div class="total reveal d4"><span>6 项日常任务用时（2 家门店实测）</span><b>−64%</b></div>
      </div>
    </section>
  </main>
</div>
<script>
/* === STAGE SCALE === */
const stage = document.getElementById('deckStage');
function fit() { const f = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(${(innerWidth - 1920 * f) / 2}px, ${(innerHeight - 1080 * f) / 2}px) scale(${f})`; }
fit(); addEventListener('resize', fit);
</script>
</body>
</html>
